name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q analytics
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test cookie-free browser tracker
        run: node --test tests/tracker.test.mjs
      - name: Check browser JavaScript syntax
        run: |
          node --check analytics/static/tracker.js
          node --check analytics/static/dashboard.js
      - name: Verify open-source license
        run: test -s LICENSE
