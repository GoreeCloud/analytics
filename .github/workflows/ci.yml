name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q analytics
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test cookie-free browser tracker
        run: node --test tests/tracker.test.mjs
      - name: Check browser JavaScript syntax
        run: |
          node --check analytics/static/tracker.js
          node --check analytics/static/dashboard.js
      - name: Verify open-source license
        run: test -s LICENSE
