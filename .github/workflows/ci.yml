name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q analytics
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test cookie-free browser tracker
        run: node --test tests/tracker.test.mjs
      - name: Check browser JavaScript syntax
        run: |
          node --check analytics/static/tracker.js
          node --check analytics/static/dashboard.js
      - name: Verify open-source license
        run: test -s LICENSE
