[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goreecloud-analytics"
version = "0.1.2"
description = "Privacy-first self-hosted web and product analytics (early MVP)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "GoreeCloud" }]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["analytics*"]

[tool.setuptools.package-data]
analytics = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
